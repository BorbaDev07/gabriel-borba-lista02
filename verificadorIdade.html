<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificador de Idade</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: mediumpurple;
            margin: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: white;
        }

        .verificador {
            background-color: white;

            width: 65%;

            padding: 20px;

            border-radius: 10px;

            text-align: center;
        }

        .campo {
            margin: 10px;
        }

        .campo label {
            margin-right: 5px;
        }

        input {
            margin: 3px;
        }

        #resultado {
            margin-top: 15px;
        }

        #imagem {
            width: 250px;
            height: 250px;

            object-fit: cover;

            border-radius: 50%;

            margin-top: 10px;
        }

        footer {
            width: 100%;

            background-color: mediumpurple;

            color: white;

            text-align: center;

            font-style: italic;

            padding: 10px;

            margin-top: 20px;
        }

    </style>

</head>


<body>

    <h1>Verificador de Idade</h1>


    <div class="verificador">

        <div class="campo">

            <label>Ano de Nascimento:</label>

            <input type="number" id="anoNascimento">

        </div>


        <div class="campo">

            <label>Sexo:</label>

            <input type="radio" name="sexo" value="Masculino">
            Masculino

            <input type="radio" name="sexo" value="Feminino">
            Feminino

        </div>


        <input type="button" value="Verificar" onclick="verificarIdade()">


        <p id="resultado">
            Preencha os dados acima para ver o resultado...
        </p>


        <img id="imagem" src="" alt="Imagem de idade">

    </div>


    <footer>
        © Uniderp
    </footer>



    <script>

        function verificarIdade() {

            var ano = document.getElementById("anoNascimento").value;

            var sexo = document.querySelector('input[name="sexo"]:checked');

            var anoAtual = new Date().getFullYear();

            var idade = anoAtual - ano;

            var resultado = document.getElementById("resultado");

            var imagem = document.getElementById("imagem");


            if (idade <= 2) {

                if (sexo.value == "Masculino") {

                    resultado.innerHTML =
                        "Detectamos bebê de " + idade + " anos.";

                    imagem.src = "imagem/bebe-menino.jpg";

                } else {

                    resultado.innerHTML =
                        "Detectamos bebê de " + idade + " anos.";

                    imagem.src = "imagem/bebe-menina.jpg";
                }

            }


            else if (idade <= 12) {

                if (sexo.value == "Masculino") {

                    resultado.innerHTML =
                        "Detectamos criança de " + idade + " anos.";

                    imagem.src = "imagem/crianca-menino.jpg";

                } else {

                    resultado.innerHTML =
                        "Detectamos criança de " + idade + " anos.";

                    imagem.src = "imagem/crianca-menina.avif";
                }

            }


            else if (idade <= 17) {

                if (sexo.value == "Masculino") {

                    resultado.innerHTML =
                        "Detectamos adolescente de " + idade + " anos.";

                    imagem.src = "imagem/adolescente-menino.jpg";

                } else {

                    resultado.innerHTML =
                        "Detectamos adolescente de " + idade + " anos.";

                    imagem.src = "imagem/adolescente-menina.avif";
                }

            }


            else if (idade <= 59) {

                if (sexo.value == "Masculino") {

                    resultado.innerHTML =
                        "Detectamos adulto de " + idade + " anos.";

                    imagem.src = "imagem/adulto-homem.jpg";

                } else {

                    resultado.innerHTML =
                        "Detectamos adulta de " + idade + " anos.";

                    imagem.src = "imagem/adulta.webp";
                }

            }


            else {

                if (sexo.value == "Masculino") {

                    resultado.innerHTML =
                        "Detectamos idoso de " + idade + " anos.";

                    imagem.src = "imagem/idoso.jpg";

                } else {

                    resultado.innerHTML =
                        "Detectamos idosa de " + idade + " anos.";

                    imagem.src = "imagem/idosa.jpg";
                }

            }

        }

    </script>

</body>

</html>
