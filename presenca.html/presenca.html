<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presença</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .alunos {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 200px;
        }

        .alunos label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #777;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        input[type="checkbox"]:checked {
            background-color: #1769e0;
            border-color: #1769e0;
        }

        input[type="checkbox"]:checked::after {
            content: "✓";
            color: white;
            font-size: 14px;
            font-weight: bold;
            position: absolute;
            left: 2px;
            top: -1px;
        }

        input[type="button"] {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #229b36;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        #resultadoPresentes,
        #resultadoAusentes {
            font-size: 20px;
            font-weight: bold;
        }

        .verde {
            color: green;
        }

        .vermelho {
            color: red;
        }
    </style>
</head>

<body>

    <body>

        <div class="container">

            <h1>presenca.html</h1>

            <div class="alunos">

                <label>
                    <input type="checkbox" value="João"> João
                </label>

                <label>
                    <input type="checkbox" value="Márcio"> Márcio
                </label>

                <label>
                    <input type="checkbox" value="Fabiana"> Fabiana
                </label>

                <label>
                    <input type="checkbox" value="Jorge"> Jorge
                </label>

                <label>
                    <input type="checkbox" value="Silvana"> Silvana
                </label>

                <label>
                    <input type="checkbox" value="Luiz"> Luiz
                </label>

                <label>
                    <input type="checkbox" value="Carlos"> Carlos
                </label>

                <label>
                    <input type="checkbox" value="Pablo"> Pablo
                </label>

            </div>

            <input type="button" value="Confirmar Presença" onclick="confirmar()">

            <p>Resultado</p>

            <p id="resultadoPresentes"></p>

            <p id="resultadoAusentes"></p>

        </div>

        <script>
            function confirmar() {

                var checkboxes = document.querySelectorAll('input[type="checkbox"]');
                var resultadoP = document.getElementById("resultadoPresentes");
                var resultadoA = document.getElementById("resultadoAusentes");

                var presentes = "";
                var ausentes = "";

                for (var i = 0; i < checkboxes.length; i++) {

                    if (checkboxes[i].checked) {
                        presentes = presentes + "<span class='verde'>" + checkboxes[i].value + "</span>, ";
                    } else {
                        ausentes = ausentes + "<span class='vermelho'>" + checkboxes[i].value + "</span>, ";
                    }
                }

                resultadoP.innerHTML = "Presentes: " + presentes;
                resultadoA.innerHTML = "Ausentes: " + ausentes;

            }
        </script>

    </body>
</body>

</html>
